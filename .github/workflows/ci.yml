name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make check test integration vuln
      - run: sudo env KOPIA_BIN="$PWD/bin/kopia" MANAGER_BIN="$PWD/bin/manager" python3 scripts/check-entrypoints.py --distinct-users
      - run: sudo env KOPIA_BIN="$PWD/bin/kopia" MANAGER_BIN="$PWD/bin/manager" python3 scripts/check-entrypoints.py --distinct-users --root-server
      - run: docker build -t manager:ci .
      - run: DOCKER_MANAGER_IMAGE=manager:ci KOPIA_BIN="$PWD/bin/kopia" go test -count=1 -run TestExternalManagerEntrypoint ./cmd/manager
      - run: docker build -f docker/kopia.Dockerfile -t kopia:ci .
      - run: shellcheck docker/*.sh
      - run: printf 'ci-password' | docker run --rm -i manager:ci hash-password
      - run: python3 scripts/check-compose.py
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=ref,event=tag
          flavor: latest=false
      - uses: docker/build-push-action@v7.3.0
        id: manager
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
      - uses: docker/build-push-action@v7.3.0
        id: kopia
        with:
          context: .
          file: docker/kopia.Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}-kopia,push-by-digest=true,name-canonical=true,push=true
      - name: Export image digests
        env:
          ARCH: ${{ matrix.arch }}
          MANAGER_DIGEST: ${{ steps.manager.outputs.digest }}
          KOPIA_DIGEST: ${{ steps.kopia.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s' "$MANAGER_DIGEST" > "$RUNNER_TEMP/digests/manager-$ARCH"
          printf '%s' "$KOPIA_DIGEST" > "$RUNNER_TEMP/digests/kopia-$ARCH"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: image-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  publish-manifests:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: image-digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish multi-platform image tags
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          for kind in manager kopia; do
            image="$IMAGE_BASE"
            if [ "$kind" = kopia ]; then image="$IMAGE_BASE-kopia"; fi
            amd64=$(cat "$RUNNER_TEMP/digests/$kind-amd64")
            arm64=$(cat "$RUNNER_TEMP/digests/$kind-arm64")
            docker buildx imagetools create --tag "$image:$VERSION" "$image@$amd64" "$image@$arm64"
            docker buildx imagetools inspect "$image:$VERSION"
          done
