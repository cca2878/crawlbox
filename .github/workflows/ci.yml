name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make check test integration vuln
      - run: sudo env KOPIA_BIN="$PWD/bin/kopia" MANAGER_BIN="$PWD/bin/manager" python3 scripts/check-entrypoints.py --distinct-users
      - run: sudo env KOPIA_BIN="$PWD/bin/kopia" MANAGER_BIN="$PWD/bin/manager" python3 scripts/check-entrypoints.py --distinct-users --root-server
      - run: docker build -t manager:ci .
      - run: docker build -f docker/kopia.Dockerfile -t kopia:ci .
      - run: shellcheck docker/*.sh
      - run: printf 'ci-password' | docker run --rm -i manager:ci hash-password
      - run: python3 scripts/check-compose.py
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=ref,event=tag
          flavor: latest=false
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/kopia.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}-kopia:${{ github.ref_name }}
