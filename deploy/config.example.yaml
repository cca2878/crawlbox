# Defaults match deploy/compose.yaml and its generated /data/config.yaml.
# For standalone or external Kopia deployments, keep your actual connection paths.
listen: :8080
data_dir: /data
credentials: /data/admin.yaml
kopia_binary: kopia
kopia_config: /data/connection/repository.config
parallel: 1
cache_bytes: 21474836480
sources: []
# Install a compatible plugin package, then replace sources: [] with sources:
# and indent the following list beneath it:
# - id: documents
#   name: Documents
#   plugin: /extensions/documents/plugin.wasm
#   sha256: <actual SHA-256 of plugin.wasm>
#   config: {}  # validated by the plugin's schema and validate_config export
#   hosts: [downloads.example.com]
#   # Exact host, matched against the URL host including a nonstandard port
#   # (example.com:8443); no wildcards. A plugin declares its own host patterns,
#   # where * covers a single label; effective access is the intersection.
#   schedule: "*/30 * * * *"
#   timezone: UTC
#   timeout: 2h
#   memory_mb: 512
#   staging_bytes: 107374182400
#   state_bytes: 1048576
#   download_parallel: 4
#   allow_private_targets: false  # permit private, loopback or link-local
#                                 # addresses. Off by default: granting a host
#                                 # says which upstream may be reached, not
#                                 # whether reaching inward is permitted.

# Optional YAML configuration for the separate Kopia Web UI proxy listener.
# Bundled Compose supplies these values via KOPIA_UI_PROXY_* environment variables;
# they are not written into the generated config.yaml. Nonempty YAML fields take precedence.
# Initially disabled; enable in /ui/ under service settings.
# kopia_ui_proxy:
#   listen: :8081
#   target: https://kopia:51515
#   fingerprint_file: /bootstrap/connection.json # JSON with a fingerprint field
# Omit fingerprint_file for HTTPS with a system-trusted certificate.
