name: crawlbox-external

# The Kopia Server is already managed outside this Compose project.
services:
  manager:
    image: ${CRAWLBOX_IMAGE:-ghcr.io/cca2878/crawlbox:${CRAWLBOX_VERSION:?set a released crawlbox tag}}
    restart: unless-stopped
    ports:
      - "${CRAWLBOX_PORT:-8080}:8080"
    environment:
      KOPIA_CONFIG_PATH: /connection/repository.config
      CRAWLBOX_LOG_LEVEL: info
    volumes:
      - manager-data:/data
      - ./connection:/connection
      - ./extensions:/extensions:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  manager-data:
