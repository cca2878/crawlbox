name: crawlbox

services:
  manager:
    image: ${CRAWLBOX_IMAGE:-ghcr.io/cca2878/crawlbox:${CRAWLBOX_VERSION:?set a released crawlbox tag}}
    command: [serve-auto]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${CRAWLBOX_PORT:-8080}:8080"
      - "${CRAWLBOX_KOPIA_UI_PORT:-8081}:8081"
    volumes:
      - manager-data:/data
      - bootstrap:/bootstrap:ro
      - extensions:/extensions:ro
    networks: [default, storage]
    environment:
      CRAWLBOX_LOG_LEVEL: info
      CRAWLBOX_BOOTSTRAP: /bootstrap
      KOPIA_URL: https://kopia:51515
      KOPIA_UI_PROXY_LISTEN: :8081
      KOPIA_UI_PROXY_TARGET: https://kopia:51515
      KOPIA_UI_PROXY_PIN_FILE: /bootstrap/connection.json
    depends_on:
      kopia:
        condition: service_started

  kopia:
    image: ${CRAWLBOX_KOPIA_IMAGE:-ghcr.io/cca2878/crawlbox-kopia:${CRAWLBOX_VERSION:?set the same released crawlbox tag}}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      KOPIA_CACHE_DIRECTORY: /data/cache
      KOPIA_LOG_DIR: /data/logs
    volumes:
      - kopia-data:/data
      - bootstrap:/bootstrap
    networks: [storage]

networks:
  default: {}
  storage:
    internal: true

volumes:
  manager-data:
  kopia-data:
  bootstrap:
  extensions:
