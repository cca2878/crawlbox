name: crawlbox

services:
  manager:
    image: ${CRAWLBOX_IMAGE:-ghcr.io/cca2878/crawlbox:v0.2.0}
    command: [serve-auto]
    restart: unless-stopped
    ports:
      - "${CRAWLBOX_PORT:-8080}:8080"
    volumes:
      - manager-data:/data
      - bootstrap:/bootstrap:ro
      - extensions:/extensions:ro
    networks: [default, storage]
    depends_on: [kopia]

  kopia:
    # Same versioned image, running the bundled fixed-version Kopia server.
    image: ${CRAWLBOX_IMAGE:-ghcr.io/cca2878/crawlbox:v0.2.0}
    command: [kopia-server]
    restart: unless-stopped
    volumes:
      - kopia-data:/data
      - bootstrap:/bootstrap
    networks: [storage]

networks:
  default: {}
  storage:
    internal: true

volumes:
  manager-data:
  kopia-data:
  bootstrap:
  extensions:
